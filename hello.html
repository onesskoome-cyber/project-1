<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, World!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a14;
    --accent-1: #7c3aed;
    --accent-2: #06b6d4;
    --accent-3: #f472b6;
    --text: #e8e8f0;
    --muted: #9a9ab0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    overflow: hidden;
    position: relative;
  }

  /* Animated aurora blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .blob:nth-child(1) {
    width: 55vmax; height: 55vmax;
    background: radial-gradient(circle, var(--accent-1), transparent 65%);
    top: -20%; left: -15%;
  }
  .blob:nth-child(2) {
    width: 45vmax; height: 45vmax;
    background: radial-gradient(circle, var(--accent-2), transparent 65%);
    bottom: -25%; right: -10%;
    animation-delay: -6s;
    animation-duration: 22s;
  }
  .blob:nth-child(3) {
    width: 35vmax; height: 35vmax;
    background: radial-gradient(circle, var(--accent-3), transparent 65%);
    top: 35%; left: 55%;
    animation-delay: -12s;
    animation-duration: 26s;
  }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1) rotate(0deg); }
    to   { transform: translate(8vmax, -6vmax) scale(1.25) rotate(40deg); }
  }

  /* Subtle grid overlay */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 4rem 4.5rem;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.09);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
    animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 35px 100px rgba(124, 58, 237, 0.25);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .tag {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--accent-2);
    border: 1px solid rgba(6, 182, 212, 0.35);
    border-radius: 999px;
    padding: 0.45rem 1.2rem;
    margin-bottom: 1.8rem;
    animation: rise 1.1s 0.15s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  h1 {
    font-size: clamp(2.8rem, 8vw, 5.5rem);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.02em;
    animation: rise 1.1s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .gradient-text {
    background: linear-gradient(120deg, #a78bfa, #22d3ee, #f9a8d4, #a78bfa);
    background-size: 250% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }

  @keyframes shine {
    to { background-position: 250% center; }
  }

  .cursor {
    display: inline-block;
    width: 0.55ch;
    color: var(--accent-2);
    animation: blink 1s step-end infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  p.subtitle {
    margin-top: 1.4rem;
    color: var(--muted);
    font-weight: 300;
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    letter-spacing: 0.04em;
    animation: rise 1.1s 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .divider {
    width: 64px;
    height: 1px;
    margin: 2rem auto 0;
    background: linear-gradient(90deg, transparent, var(--accent-2), transparent);
    animation: rise 1.1s 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .lang {
    margin-top: 1.6rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--muted);
    animation: rise 1.1s 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .lang span { color: var(--accent-3); }

  /* Floating particles */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.6);
    animation: float linear infinite;
    z-index: 0;
  }

  @keyframes float {
    from { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.8; }
    to   { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  @media (max-width: 520px) {
    .card { padding: 2.5rem 1.8rem; margin: 1rem; }
  }
</style>
</head>
<body>

  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="grid"></div>

  <main class="card">
    <div class="tag">Greetings from the code</div>
    <h1><span class="gradient-text" id="typewriter"></span><span class="cursor">_</span></h1>
    <p class="subtitle">Every great project begins with these two little words.</p>
    <div class="divider"></div>
    <p class="lang">$ node hello.js <span>// running since 1972</span></p>
  </main>

  <script>
    const text = 'Hello, World!';
    const el = document.getElementById('typewriter');
    let i = 0;

    function type() {
      if (i <= text.length) {
        el.textContent = text.slice(0, i++);
        setTimeout(type, 90);
      }
    }
    setTimeout(type, 800);

    // Generate floating particles
    for (let n = 0; n < 30; n++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = 8 + Math.random() * 14 + 's';
      p.style.animationDelay = -Math.random() * 20 + 's';
      p.style.width = p.style.height = 2 + Math.random() * 3 + 'px';
      document.body.appendChild(p);
    }
  </script>

</body>
</html>
